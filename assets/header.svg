<svg xmlns="http://www.w3.org/2000/svg" width="860" height="240" viewBox="0 0 860 240" role="img" aria-label="suyash@github ~ $ ./whoami.sh. Suyash Vasal Jain: full-stack developer, applied ML engineer, Android developer.">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .t { font-size: 16px; fill: #6b7785; }
    @keyframes in { from { opacity: 0; transform: translateY(14px); } }
    
    .pr { font-size: 24px; }
    .name { font-size: 60px; font-weight: 700; fill: #e6edf3; animation: in .7s ease-out 2.7s both; }
    .role { font-size: 28px; fill: #38bdf8; opacity: 0; }
    .r { animation: roles 12s ease-in-out infinite; }
    .r1 { animation-delay: 3.6s; }
    .r2 { animation-delay: 6.6s; }
    .r3 { animation-delay: 9.6s; }
    .r4 { animation-delay: 12.6s; }
    
    .cover { transform: translateX(417.6px); animation: type 2s steps(29, end) .4s both; }
    .cur { transform: translateX(417.6px); animation: type 2s steps(29, end) .4s both; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes type { from { transform: translateX(0); } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes roles {
      0% { opacity: 0; transform: translateY(8px); } 4% { opacity: 1; transform: translateY(0); }
      21% { opacity: 1; transform: translateY(0); } 25% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .r1 { opacity: 1 !important; } }
  </style>
  <rect width="860" height="240" rx="12" fill="#0b0f14"/>
  <path d="M0 40V12a12 12 0 0 1 12-12h836a12 12 0 0 1 12 12V40z" fill="#111821"/>
  <circle cx="24" cy="20" r="6" fill="#f87171" fill-opacity=".85"/><circle cx="46" cy="20" r="6" fill="#fbbf24" fill-opacity=".85"/><circle cx="68" cy="20" r="6" fill="#34d399" fill-opacity=".85"/>
  <text class="t" x="430.0" y="26" text-anchor="middle">suyash@github: ~</text>
  <rect x="0.5" y="0.5" width="859" height="239" rx="12" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <text class="pr" x="32" y="96" textLength="417.6" lengthAdjust="spacing"><tspan fill="#38bdf8">suyash@github</tspan><tspan fill="#c9d1d9"> ~ </tspan><tspan fill="#818cf8">$</tspan><tspan fill="#34d399"> ./whoami.sh</tspan></text>
  <rect class="cover" x="32" y="68" width="457.6" height="40" fill="#0b0f14"/>
  <g class="cur"><g class="blink"><rect x="32" y="76" width="12" height="24" fill="#38bdf8"/></g></g>
  <text class="name" x="32" y="166">Suyash Vasal Jain</text>
  <text class="role r r1" x="32" y="208"><tspan fill="#34d399">&gt; </tspan>Full-stack developer</text><text class="role r r2" x="32" y="208"><tspan fill="#34d399">&gt; </tspan>Applied ML engineer</text><text class="role r r3" x="32" y="208"><tspan fill="#34d399">&gt; </tspan>Android developer</text><text class="role r r4" x="32" y="208"><tspan fill="#34d399">&gt; </tspan>President, CODEC</text>
</svg>
