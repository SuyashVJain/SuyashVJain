<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Suyash Vasal Jain. Full-stack developer, applied ML engineer, Android developer, President of CODEC.">
  <title>Suyash Vasal Jain</title>
  <defs>
    <radialGradient id="sky" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emerald" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="16"/></clipPath>
    <clipPath id="lineClip"><rect x="300" y="222" width="600" height="4"/></clipPath>
  </defs>

  <style>
    .sans { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Roboto, Arial, sans-serif; }
    .name { font-size: 74px; font-weight: 700; fill: #e6edf3; letter-spacing: -1px; }
    .role { font-size: 36px; font-weight: 500; fill: #38bdf8; opacity: 0; }
    .meta { font-size: 23px; fill: #8b98a5; letter-spacing: 0.3px; }
    .o1 { animation: d1 22s ease-in-out infinite alternate; }
    .o2 { animation: d2 26s ease-in-out infinite alternate; }
    .o3 { animation: d3 30s ease-in-out infinite alternate; }
    .r { animation: roles 12s ease-in-out infinite; }
    .r2 { animation-delay: 3s; }
    .r3 { animation-delay: 6s; }
    .r4 { animation-delay: 9s; }
    .sweep { animation: sweep 4.5s ease-in-out infinite; }
    @keyframes d1 { from { transform: translate(0, 0); } to { transform: translate(260px, 40px); } }
    @keyframes d2 { from { transform: translate(0, 0); } to { transform: translate(-300px, -50px); } }
    @keyframes d3 { from { transform: translate(0, 0); } to { transform: translate(-220px, -30px); } }
    @keyframes roles {
      0%   { opacity: 0; transform: translateY(8px); }
      4%   { opacity: 1; transform: translateY(0); }
      21%  { opacity: 1; transform: translateY(0); }
      25%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes sweep { from { transform: translateX(-220px); } to { transform: translateX(620px); } }
    @media (prefers-reduced-motion: reduce) {
      .o1, .o2, .o3, .r, .sweep { animation: none; }
      .r1 { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#0b0f14"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle class="o1" cx="180" cy="70" r="240" fill="url(#sky)"/>
    <circle class="o2" cx="1060" cy="250" r="260" fill="url(#indigo)"/>
    <circle class="o3" cx="760" cy="330" r="200" fill="url(#emerald)"/>
    <rect width="1200" height="300" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>

  <g class="sans" text-anchor="middle">
    <text class="name" x="600" y="124">Suyash Vasal Jain</text>
    <g transform="translate(0 0)">
      <text class="role r r1" x="600" y="190">Full-stack developer</text>
      <text class="role r r2" x="600" y="190">Applied ML engineer</text>
      <text class="role r r3" x="600" y="190">Android developer</text>
      <text class="role r r4" x="600" y="190">President, CODEC</text>
    </g>
    <text class="meta" x="600" y="268">B.Tech CS&amp;IT  ·  SUAS Indore  ·  2024–2028  ·  CGPA 8.94</text>
  </g>

  <rect x="300" y="222" width="600" height="2" fill="url(#track)"/>
  <g clip-path="url(#lineClip)">
    <rect class="sweep" x="300" y="222" width="220" height="2" fill="url(#accent)"/>
  </g>
</svg>
