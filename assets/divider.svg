<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="20" viewBox="0 0 1200 20" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="60" y="0" width="1080" height="20"/></clipPath>
  </defs>
  <style>
    .s { animation: s 5s ease-in-out infinite; }
    @keyframes s { from { transform: translateX(-240px); } to { transform: translateX(1100px); } }
    @media (prefers-reduced-motion: reduce) { .s { animation: none; transform: translateX(420px); } }
  </style>
  <rect x="60" y="9" width="1080" height="2" fill="url(#base)"/>
  <g clip-path="url(#c)">
    <rect class="s" x="60" y="9" width="240" height="2" fill="url(#glow)"/>
  </g>
</svg>
