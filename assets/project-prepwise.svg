<svg xmlns="http://www.w3.org/2000/svg" width="420" height="222" viewBox="0 0 420 222" role="img" aria-label="Prepwise: AI mock interviews generated from your own syllabus PDF through a RAG pipeline, with per-answer scoring and weak-topic tracking. 15 API routes, 88 backend tests. Stack: Next.js · FastAPI · FAISS · Supabase. live: prepwise-mocha.vercel.app.">
